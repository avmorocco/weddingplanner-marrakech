# Mise en ligne automatique du site sur l'hébergement OVH (dossier www) en SFTP.
# Se lance à chaque envoi sur la branche main, ou à la main (onglet Actions > Run workflow).
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   OVH_SFTP_USER      identifiant FTP OVH
#   OVH_SFTP_PASSWORD  mot de passe FTP OVH
# Les fichiers sont envoyés et remplacés ; rien n'est supprimé sur le serveur.
name: Mise en ligne OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SFTP_HOST: ftp.cluster129.hosting.ovh.net
      REMOTE_DIR: www
      SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
    steps:
      - name: Vérifier les secrets
        id: check
        run: |
          if [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASSWORD" ]; then
            echo "::warning::Secrets OVH_SFTP_USER / OVH_SFTP_PASSWORD absents : mise en ligne ignorée."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le site
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Installer lftp
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer sur OVH (SFTP, sinon FTP chiffré)
        if: steps.check.outputs.ready == 'true'
        run: |
          # Supprime d'éventuels espaces ou retours à la ligne copiés avec les secrets
          U="$(printf '%s' "$SFTP_USER" | tr -d '[:space:]')"
          export LFTP_PASSWORD="$(printf '%s' "$SFTP_PASSWORD" | tr -d '\r\n')"
          upload() {
            lftp --env-password -u "$U" "$1" <<LFTP
          set sftp:auto-confirm yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 \
            --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore \
            ./ $REMOTE_DIR/
          bye
          LFTP
          }
          echo "Essai 1 : SFTP (port 22)"
          if upload "sftp://$SFTP_HOST"; then echo "Mise en ligne réussie en SFTP"; exit 0; fi
          echo "Essai 2 : FTP chiffré TLS (FTPS, port 21)"
          if upload "ftp://$SFTP_HOST"; then echo "Mise en ligne réussie en FTPS"; exit 0; fi
          echo "::error::OVH a refusé la connexion en SFTP et en FTPS. Vérifiez l'identifiant (secret OVH_SFTP_USER) et le mot de passe FTP (secret OVH_SFTP_PASSWORD) dans l'espace OVH, onglet FTP-SSH."
          exit 1

      - name: Vérifier le site en ligne
        if: steps.check.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://www.weddingplanner-marrakech.com/)
          echo "Page d'accueil : HTTP $code"
          test "$code" = "200"
